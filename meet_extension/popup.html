<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Sumi · Meet</title><link rel="stylesheet" href="popup.css"></head>
<body>
<h1>Vincular esta aba</h1>
<p>Abra sua reunião do Meet. No Sumi, copie o código em Configurações.</p>
<label for="token">Código de conexão local</label>
<input id="token" type="password" autocomplete="off" maxlength="150">
<button id="pair">Vincular esta aba do Meet</button>
<p id="status" role="status">A saída automática começa desligada no aplicativo.</p>
<p class="note">Quando ativada, fecha somente esta aba após o desaparecimento. Não encerra a reunião dos outros participantes.</p>
<script type="module" src="popup.js"></script>
</body></html>
